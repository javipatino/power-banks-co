<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Power Banks CO · Rents</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
  :root{--bg:#f6f6f4;--card:#fff;--soft:#f1f0ec;--line:#e4e3de;--line2:#c9c8c1;--blue:#2a78d6;--orange:#eb6834;--gray:#888780;--ok-bg:#e3f4e1;--ok:#1f6b1c;--bad-bg:#fbe5e4;--bad:#a12b2a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:#000;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5}
  main{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:24px;font-weight:600;margin:0}
  h2{font-size:18px;font-weight:600;margin:0 0 4px}
  .muted{font-size:13px;color:#000}
  section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:20px}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin:12px 0 8px;font-size:12px}
  .legend span{display:flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:12px}
  .col{border:1px solid var(--line);border-radius:12px;padding:16px}
  .col h3{font-size:16px;font-weight:600;margin:0}.col h3 small{font-weight:400;font-size:12px}
  .kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 16px}
  .t{background:var(--soft);border-radius:8px;padding:10px}.t .l{font-size:12px}.t .v{font-size:22px;font-weight:600}
  .lbl{font-size:13px;font-weight:600;margin:0 0 4px}
  .dw{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;height:90px;margin:6px 0 4px}
  .dw div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px}
  .dw .b{width:70%;background:var(--blue);border-radius:3px 3px 0 0;margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font-weight:600;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line2)}
  td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:middle}
  .n{text-align:right;white-space:nowrap}
  .sm{font-size:11px}
  .pill{font-size:11px;padding:1px 7px;border-radius:6px;white-space:nowrap}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
  tr.cat{cursor:pointer}tr.cat:hover td{background:var(--soft)}
  .ch{display:inline-block;width:12px;transition:transform .15s}
  .bw{display:flex;align-items:center;gap:6px}.bw .b{height:12px;background:var(--blue);border-radius:0 3px 3px 0}
  .sub{background:var(--soft);border-radius:8px;padding:6px 10px;margin:2px 0 8px}.sub td{font-size:12px;padding:4px}.sub tr:first-child td{border-top:none;font-weight:600}
  .scroll{overflow-x:auto}
  .city{border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px}
  .err{background:var(--bad-bg);color:var(--bad);padding:12px;border-radius:8px}
  @media (max-width:760px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Power Banks CO · Rents</h1>
  <div class="muted" id="meta">Loading…</div>

  <section>
    <h2>1 · Completed rents per week</h2>
    <div class="muted">Monday–Sunday weeks (Bogotá time), by week of rent start. Office, warehouse and test stations excluded. not_classified = station no longer in the station list.</div>
    <div class="legend">
      <span><i style="background:var(--blue)"></i>Bogota</span>
      <span><i style="background:var(--orange)"></i>Medellin</span>
      <span><i style="background:var(--gray)"></i>not_classified</span>
    </div>
    <div style="position:relative;height:380px"><canvas id="weekly" aria-label="Completed rents per week by city"></canvas></div>
  </section>

  <section>
    <h2>2 · Overview</h2>
    <div class="muted" id="s2meta"></div>
    <div class="two"><div class="col" id="s2-Bogota"></div><div class="col" id="s2-Medellin"></div></div>
  </section>

  <section>
    <h2>3 · Rents by category</h2>
    <div class="muted" id="s3meta"></div>
    <div class="city" id="s3-Bogota"></div>
    <div class="city" id="s3-Medellin"></div>
  </section>
</main>

<script>
const K = '#000000';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pill = s => `<span class="pill ${s === 'ok' ? 'ok' : 'bad'}">${esc(s)}</span>`;
const fmtDate = iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-US', {month: 'short', day: 'numeric'});
const val = (v, suf = '') => v === null || v === undefined ? '–' : v + suf;

fetch('data/dashboard.json?t=' + Date.now())
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(render)
  .catch(e => { document.getElementById('meta').innerHTML = `<div class="err">Could not load data/dashboard.json (${esc(e.message)}).</div>`; });

function render(D) {
  const win = `${fmtDate(D.window.start)} – ${fmtDate(D.window.end)}`;
  document.getElementById('meta').textContent = `Data refresh: ${D.generated_from_refresh} (Bogotá) · Sections 2–3 use the last 2 complete weeks: ${win}`;
  document.getElementById('s2meta').textContent = `Last 2 complete weeks · ${win}`;
  document.getElementById('s3meta').textContent = `Last 2 complete weeks · ${win} · click a category to see its stations with rents`;
  section1(D.section1);
  const maxDow = Math.max(1, ...Object.values(D.cities).flatMap(c => c.dow_totals));
  const maxRps = Math.max(0.01, ...Object.values(D.cities).flatMap(c => c.categories.map(x => x.rents_per_station)));
  for (const [city, c] of Object.entries(D.cities)) { section2(city, c, maxDow); section3(city, c, maxRps); }
}

function section1(S) {
  const labels = S.weeks.map(fmtDate);
  const ds = (label, data, color) => ({label, data, backgroundColor: color, borderRadius: {topLeft: 4, topRight: 4}, borderSkipped: 'bottom', maxBarThickness: 18, categoryPercentage: 0.9, barPercentage: 0.95});
  const all = [...S.series.Bogota, ...S.series.Medellin, ...S.series.not_classified];
  new Chart(document.getElementById('weekly'), {
    type: 'bar', plugins: [ChartDataLabels],
    data: {labels, datasets: [ds('Bogota', S.series.Bogota, '#2a78d6'), ds('Medellin', S.series.Medellin, '#eb6834'), ds('not_classified', S.series.not_classified, '#888780')]},
    options: {
      responsive: true, maintainAspectRatio: false, animation: false, layout: {padding: {top: 20}},
      interaction: {mode: 'index', intersect: false},
      plugins: {legend: {display: false}, tooltip: {callbacks: {title: i => 'Week of ' + i[0].label}},
        datalabels: {anchor: 'end', align: 'end', offset: 1, color: K, font: {size: 11}, clamp: true}},
      scales: {
        x: {offset: true, grid: {display: true, offset: true, drawOnChartArea: false, drawTicks: true, tickLength: 14, tickWidth: 1.5, color: K}, border: {color: K}, ticks: {color: K, autoSkip: false, maxRotation: 45}},
        y: {beginAtZero: true, suggestedMax: Math.max(...all) * 1.08, grid: {color: '#e4e3de'}, border: {display: false}, ticks: {color: K}, title: {display: true, text: 'Completed rents', color: K}}
      }
    }
  });
}

function section2(city, c, maxDow) {
  const tile = (l, v) => `<div class="t"><div class="l">${l}</div><div class="v">${v}</div></div>`;
  const days = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
  document.getElementById('s2-' + city).innerHTML = `
    <h3>${city} <small>· ${c.completed_rents} completed rents</small></h3>
    <div class="kp">
      ${tile('Median rent duration', val(c.median_minutes, ' min'))}
      ${tile('Returned to same station', val(c.same_station_pct, '%'))}
      ${tile('Stations with ≥1 rent / week', val(c.active_pct, '%'))}
      ${tile('Rents from top 10% stations', val(c.top10_share_pct, '%'))}
    </div>
    <div class="lbl">Total rents per weekday (2 wk)</div>
    <div class="dw">${c.dow_totals.map(v => `<div>${v}<span class="b" style="height:${v ? Math.max(v / maxDow * 60, 2) : 0}px"></span></div>`).join('')}</div>
    <div class="dw" style="height:auto;margin:0 0 16px">${days.map(d => `<div>${d}</div>`).join('')}</div>
    <div class="lbl">Top 10% stations</div>
    <div class="scroll"><table><thead><tr><th>Station</th><th class="n">Rents (2 wk)</th><th>Status</th></tr></thead><tbody>
      ${c.top_stations.length ? c.top_stations.map(s => `<tr><td>${esc(s[1])}<div class="sm">${s[0]} · ${esc(s[2])}</div></td><td class="n">${s[3]}</td><td>${pill(s[4])}</td></tr>`).join('') : '<tr><td colspan="3">No rents in this window.</td></tr>'}
    </tbody></table></div>`;
}

function section3(city, c, maxRps) {
  const el = document.getElementById('s3-' + city);
  el.innerHTML = `<h3 style="font-size:16px;margin:0">${city} <small style="font-weight:400;font-size:12px">· ${c.stations} stations · ${c.completed_rents} completed rents</small></h3>
    <div class="scroll"><table style="min-width:560px"><thead><tr><th>Category</th><th style="width:32%">Rents per station (2 wk)</th><th class="n">Stations</th><th class="n">Active</th><th class="n">Rents</th><th class="n">Share</th></tr></thead><tbody></tbody></table></div>`;
  const tb = el.querySelector('tbody'), open = new Set();
  const draw = () => {
    tb.innerHTML = c.categories.map((r, i) => {
      const o = open.has(i), L = c.category_stations[r.category] || [];
      const row = `<tr class="cat" data-i="${i}"><td><span class="ch" style="transform:rotate(${o ? 90 : 0}deg)">›</span> ${esc(r.category)}</td>
        <td><div class="bw"><span class="b" style="width:${r.rents_per_station / maxRps * 75}%"></span>${r.rents_per_station.toFixed(2)}</div></td>
        <td class="n">${r.stations}</td><td class="n">${r.active_pct}%</td><td class="n">${r.rents}</td><td class="n">${r.share_pct}%</td></tr>`;
      const sub = !o ? '' : `<tr><td colspan="6" style="border-top:none;padding:0 4px"><div class="sub">${L.length
        ? `<table><tr><td>Station</td><td class="n">Rents (2 wk)</td><td>Status now</td></tr>${L.map(s => `<tr><td>${esc(s[1])}<div class="sm">${s[0]} · ${esc(s[2])}</div></td><td class="n">${s[3]}</td><td>${pill(s[4])}</td></tr>`).join('')}</table>`
        : '<div class="sm" style="padding:4px">No station had rents in these 2 weeks.</div>'}</div></td></tr>`;
      return row + sub;
    }).join('');
  };
  tb.addEventListener('click', e => { const tr = e.target.closest('tr.cat'); if (!tr) return; const i = +tr.dataset.i; open.has(i) ? open.delete(i) : open.add(i); draw(); });
  draw();
}
</script>
</body>
</html>
